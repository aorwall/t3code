# Response headers shared by every content location in docker/nginx.conf.
#
# This is an include rather than a `server`-level block because nginx's
# add_header does not merge: a location that sets any header of its own — the
# cache-control ones here do — drops every header inherited from the server
# block. Including the same file everywhere is what keeps them from silently
# disappearing on exactly the locations that needed them.
#
# $csp is defined in the server block; see the CSP notes there.

add_header Content-Security-Policy $csp always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
