# Static host for the built T3 Code web app (see docker/Dockerfile).
#
# Backend paths (/api, /ws, /.well-known/t3, /oauth/token) are routed to the
# Moatless backend by the edge, above this server — nothing here proxies.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not disclose the precise nginx version in the Server header or on
    # error pages.
    server_tokens off;

    # A static SPA host answers reads only. Write verbs reaching here mean a
    # backend path was not routed to the backend, and a 405 from nginx reads
    # like a rejected request rather than one that never arrived — so keep the
    # method list narrow and diagnose routing, not this server.
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }

    # Deny dotfiles and VCS/build metadata, so the SPA fallback below cannot
    # mask them with an HTTP 200. /.well-known is exempt: it is a real backend
    # prefix (T3 environment discovery) and must 404 here rather than 403, so a
    # misrouted request looks like the miss it is.
    location ~ /\.(?!well-known/) {
        deny all;
        return 404;
    }

    # Never serve source maps. The published image builds with them off
    # (T3CODE_WEB_SOURCEMAP=0); block by extension as defence in depth for
    # images built with them on.
    location ~ \.map$ {
        return 404;
    }

    # -----------------------------------------------------------------------
    # Content-Security-Policy
    #
    #   script-src   'self' for the bundles; 'wasm-unsafe-eval' because the
    #                @pierre/diffs worker instantiates WebAssembly (it permits
    #                wasm compilation only, not arbitrary eval).
    #   style-src    'unsafe-inline' is required by Tailwind v4, which emits
    #                inline style attributes.
    #   worker-src   the diff worker is bundled as a same-origin module worker;
    #                blob: covers Vite's fallback form.
    #   connect-src  'self' covers every HTTP call and the /ws socket, all
    #                same-origin through the edge. This image builds with the
    #                Clerk, relay and OTLP endpoints unset, so there is no
    #                third-party origin to allow — configuring any of them
    #                means widening this directive to match.
    #   img-src      data: and blob: for inline and object-URL images; https:
    #                for images in agent-authored markdown.
    #   frame-src    the web build's browser preview is a real cross-origin
    #                <iframe> (apps/web/src/browser/HostedBrowserFrame.tsx),
    #                whose src is a per-task sandbox server served from a
    #                distinct origin (e.g. `<task-id>--<port>.preview.<domain>`)
    #                — only the Electron build uses a webview. 'self' therefore
    #                blocks the embed with Chrome's CSP block page ("This content
    #                is blocked"). Driven by ${CSP_FRAME_SRC} (rendered by the
    #                nginx entrypoint's envsubst step); defaults to `https:`, the
    #                minimal allowance for the external https preview URLs. Local
    #                http clusters override it to also allow their preview host.
    # -----------------------------------------------------------------------
    set $csp "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; media-src 'self' blob:; manifest-src 'self'; frame-src 'self' ${CSP_FRAME_SRC}; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'";

    # SPA fallback. The router uses browser history, so every deep link is a
    # path that does not exist on disk.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/security-headers.conf;
    }

    # Content-hashed build output; safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # The one file whose URL is stable and whose content changes every deploy.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        include /etc/nginx/security-headers.conf;
    }

    # Container probe. Deliberately outside the SPA fallback: try_files would
    # answer it with index.html and a probe would pass on a broken deploy.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
}
