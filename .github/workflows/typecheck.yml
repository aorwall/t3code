# Typecheck `apps/web` and the workspace packages it depends on, on every pull
# request and every push to main. The rest of the workspace (`apps/server`,
# `apps/desktop`, `apps/mobile`, ...) is not shipped by this fork and is not
# checked here; `tsc` peaks at 8.5 GiB on `apps/server`, more than this runner has.
#
# This is a fork-only workflow. It exists because the sentence "CI owns the full
# suite" is not true here: every workflow inherited from upstream is switched off
# in GitHub's Actions settings (see the README in this directory), so before this
# file the only job on a push to main was the image build — a `vp build`, which
# does not typecheck. A type error therefore reached `main` unnoticed (#109, a
# `ChangeRequestStatusIcon` call missing a required prop) and was found by a
# maintainer typechecking by hand days later.
#
# Of the tests it runs only `@t3tools/contracts`: its Moatless fixtures are the
# one check that a backend response decodes against the schemas the client
# reads. The full `pnpm test` is roughly thirteen minutes on a machine larger
# than this runner, and its parallel pass is what gets a 4 CPU / 8 GiB box
# evicted. Every other test stays local and targeted; see AGENTS.md.
#
# Runner: `staging-runners-large`, the same org-scoped ARC scale set the image
# build uses — 4 CPU and 8 GiB, defined in soaplabs/soap-platform-gitops under
# `apps/nonprod/arc-runner-large-set`. Do not change this to `ubuntu-latest`:
# GitHub-hosted labels are not answered in this repository at all, and a job
# asking for one dies in about 30 seconds with no runner assigned and no step
# recorded. The set's egress allowlist permits only 443/TCP, which every fetch
# below respects.

name: Typecheck

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: Typecheck
    runs-on: ${{ vars.CI_RUNNER || 'staging-runners-large' }}
    timeout-minutes: 30
    env:
      CI: "1"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      # Electron's postinstall fetches a ~100 MB binary this job never launches.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # Node sizes its default heap from the host's memory and never sees the
      # pod's cap, so on a capped runner it will happily grow past it and be
      # killed. Half of this set's 8 GiB, the same share the merge tooling's
      # `heapMb` derives, leaving the other half for everything else.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # Not `engines.node`: upstream pinned Node 26 there (#23165), whose
          # binary needs `libatomic.so.1` this runner image lacks and which ships
          # no corepack. Keep in step with NODE_VERSION in docker/Dockerfile.
          node-version: "24.18.1"

      # pnpm's version comes from the `packageManager` field, not from a pin
      # here, so this cannot drift from what a developer's install resolves.
      - run: corepack enable

      # The full workspace, so every package `apps/web` imports is installed.
      # Dependency build scripts stay off because `node-pty`, which only
      # `apps/server` declares, compiles through node-gyp and this runner image
      # carries no `make`. A package's `.d.ts` files ship
      # in its tarball, so nothing those builds produce is a typecheck input.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # `--ignore-scripts` also skips this repo's own `prepare`, which patches
      # the TypeScript binary `pnpm typecheck` then runs. Run it by hand.
      - run: pnpm run prepare

      # Before the typecheck, so a runner lost to its memory still reports these.
      - run: pnpm --filter @t3tools/contracts test

      # One project at a time, to stay inside this 8 GiB runner.
      - run: pnpm exec vp run --filter '@t3tools/web...' --fail-if-no-match --concurrency-limit 1 typecheck
